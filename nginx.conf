server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Declare the encoding on the wire. Browsers cope without it (the HTML has a
    # meta charset and ES modules are always UTF-8), but anything else fetching
    # these files falls back to Latin-1 and mangles the em-dashes and glyphs.
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Default: our own HTML and src/ JS change on every deploy, so keep it short.
    add_header Cache-Control "public, max-age=300" always;

    # Art and audio are byte-for-byte copies of the original game's files and
    # never change. A fresh visitor pulls ~4-5 MB of these; caching them for a
    # year means returning players re-download essentially nothing.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Pinned Phaser/Three builds. Deliberately 30d rather than a year: the
    # filenames aren't version-stamped, so an upgrade needs cached clients to
    # pick it up in reasonable time instead of running a stale engine.
    location ^~ /lib/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }
}
