name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Zero dependencies, so there is nothing to install.
      - name: Run the suite
        run: npm test

  deploy:
    name: Deploy
    # A red suite blocks the deploy outright.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Ship only what the game needs - no tests, tooling, Docker or Fly config.
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html 3d.html .nojekyll _site/
          cp -r lib assets src _site/
          echo "Site contents:" && du -sh _site/* | sort -h

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
